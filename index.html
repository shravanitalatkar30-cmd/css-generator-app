<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Generator - Week 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <h1>CSS Code Generator</h1>
        
        <div class="app-grid">
            <div class="controls">
                <label>Border Radius:</label>
                <input type="range" id="radius-slider" min="0" max="100" value="0">
                <span id="radius-val">0</span>px
            </div>

            <div class="preview-area">
                <div id="preview-box"></div>
                <textarea id="css-code" readonly>border-radius: 0px;</textarea>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
