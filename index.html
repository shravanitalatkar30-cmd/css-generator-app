<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Generator - Week 6</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <h1>CSS Generator Pro</h1>
        <p>Design, Preview, and Export Code</p>
    </header>

    <main class="main-container">
        <div class="app-grid">
            
            <!-- Settings Section -->
            <section class="controls-panel">
                <h2>Layout Settings</h2>
                
                <div class="control-group">
                    <label for="template-select">Choose Layout:</label>
                    <select id="template-select">
                        <option value="card">Standard Card</option>
                        <option value="grid">2x2 Photo Grid</option>
                        <option value="columns">Two-Column Split</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>Colors & Style:</label>
                    <div class="input-row">
                        <span>Box: <input type="color" id="item-color" value="#3498db"></span>
                        <span>Canvas: <input type="color" id="bg-color" value="#ffffff"></span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Dimensions:</label>
                    <div class="slider-box">
                        <span>Border Radius: <span id="radius-val">10</span>px</span>
                        <input type="range" id="radius-slider" min="0" max="100" value="10">
                    </div>
                    <div class="slider-box">
                        <span>Container Padding: <span id="padding-val">25</span>px</span>
                        <input type="range" id="padding-slider" min="0" max="60" value="25">
                    </div>
                </div>
            </section>

            <!-- Display & Export Section -->
            <section class="preview-panel">
                <h2>Visual Preview</h2>
                <div id="preview-container" class="card-template">
                    <div class="preview-item">Element 1</div>
                    <div class="preview-item grid-only">Element 2</div>
                    <div class="preview-item grid-only">Element 3</div>
                    <div class="preview-item grid-only">Element 4</div>
                </div>

                <div class="export-area">
                    <div class="export-header">
                        <label>Generated CSS</label>
                        <button id="copy-btn">Copy to Clipboard</button>
                    </div>
                    <textarea id="css-code" readonly></textarea>
                </div>
            </section>

        </div>
    </main>

    <footer class="app-footer">
        <p>&copy; 2026 CSS Generator App | Week 6: Clipboard Integration</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
